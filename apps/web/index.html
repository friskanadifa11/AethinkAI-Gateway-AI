<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>AethinkAI Gateway AI</title>
    <link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the operator's motion preference before first paint so nothing
      // animates for someone who asked for stillness.
      try {
        var m = localStorage.getItem("aethink.motion");
        if (m === "reduced") document.documentElement.dataset.motion = "reduced";
        if (m === "full") document.documentElement.dataset.motion = "full";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
